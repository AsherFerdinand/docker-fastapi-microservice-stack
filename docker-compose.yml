services:
  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mediadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth-service
    container_name: local_auth_service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=mediadb
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: