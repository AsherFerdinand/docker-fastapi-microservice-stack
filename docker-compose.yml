services:
  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mediadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth-service
    container_name: local_auth_service
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=mediadb
    depends_on:
      - postgres
      - redis

  file-service:
    build: ./services/file-service
    container_name: local_file_service
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=mediadb
      - REDIS_HOST=redis
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

  nginx-gateway:
    image: nginx:alpine
    container_name: local_nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/public_html:ro
    depends_on:
      - auth-service
      - file-service

volumes:
  pgdata: