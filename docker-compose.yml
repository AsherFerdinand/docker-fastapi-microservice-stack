version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mediadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth-service
    container_name: local_auth_service
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/mediadb
      JWT_SECRET: supersecretkey
    depends_on:
      - postgres

  file-service:
    build: ./services/file-service
    container_name: local_file_service
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/mediadb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretkey
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

  nginx-gateway:
    image: nginx:alpine
    container_name: local_nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/public_html:ro
    depends_on:
      - auth-service
      - file-service

volumes:
  pgdata: