events { worker_connections 1024; }

http {
    upstream auth_cluster {
        server auth-service:3000;
    }

    upstream file_cluster {
        server file-service:4000;
    }

    server {
        listen 80;

        # Serve frontend files from /public_html
        location / {
            root /public_html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Route Auth API requests
        location /api/v1/auth/ {
            proxy_pass http://auth_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route File API requests
        location /api/v1/files/ {
            proxy_pass http://file_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}